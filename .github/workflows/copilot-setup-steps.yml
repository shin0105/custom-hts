name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # Python backend setup
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install UV package manager
        run: pip install uv

      - name: Create virtual environment
        run: uv venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          uv pip install pandas fastapi uvicorn pytest black flake8
          uv pip install yfinance aiohttp psycopg2-binary python-multipart

      # Node.js frontend setup
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: |
          npm install react react-dom typescript @types/react @types/react-dom
          npm install @testing-library/react @testing-library/jest-dom
          npm install recharts axios react-router-dom

      # Code quality checks
      - name: Run Python linter
        run: |
          source .venv/bin/activate
          flake8 --max-line-length=88 --extend-ignore=E203,W503 backend/

      - name: Run Python formatter check
        run: |
          source .venv/bin/activate
          black --check backend/

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          pytest backend/tests/ -v

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test -- --coverage --watchAll=false

      # Environment validation
      - name: Validate environment setup
        run: |
          echo "✅ Python setup complete"
          source .venv/bin/activate
          python --version
          pip list | grep -E "(pandas|fastapi|yfinance)"
          
          echo "✅ Node.js setup complete"
          node --version
          npm list --depth=0 | grep -E "(react|typescript)"
          
          echo "✅ HTS development environment ready"